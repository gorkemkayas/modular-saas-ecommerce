<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Modular SaaS E-Commerce platform</title>
  <desc id="description">A storefront and merchant dashboard connect through one API host to ten business modules, module-owned data and events, and external provider adapters.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <rect x="48" y="44" width="44" height="5" rx="2.5" fill="url(#accent)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="84" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="2.6">COMMERCE THROUGH CLEAR BOUNDARIES</text>
    <text x="48" y="131" fill="#f8fafc" font-size="38" font-weight="700">One platform. Ten business modules.</text>
    <text x="48" y="163" fill="#b6c4d5" font-size="17">A modular monolith with a storefront, merchant tools, and durable event processing.</text>

    <rect x="48" y="207" width="196" height="112" rx="12" fill="#132b43" stroke="#3b82f6" stroke-opacity="0.7"/>
    <text x="68" y="236" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.2">EXPERIENCE</text>
    <text x="68" y="266" fill="#f1f5f9" font-size="18" font-weight="600">Storefront + Admin</text>
    <text x="68" y="293" fill="#b6c4d5" font-size="14">Next.js / React</text>

    <rect x="275" y="207" width="196" height="112" rx="12" fill="#132b43" stroke="#3b82f6" stroke-opacity="0.7"/>
    <text x="295" y="236" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.2">APPLICATION</text>
    <text x="295" y="266" fill="#f1f5f9" font-size="18" font-weight="600">ASP.NET Core API</text>
    <text x="295" y="293" fill="#b6c4d5" font-size="14">JWT / CQRS / MediatR</text>

    <rect x="502" y="207" width="196" height="112" rx="12" fill="#0f3434" stroke="#34d399" stroke-opacity="0.8"/>
    <text x="522" y="236" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="1.2">BUSINESS</text>
    <text x="522" y="266" fill="#f1f5f9" font-size="18" font-weight="600">10 Domain Modules</text>
    <text x="522" y="293" fill="#b6c4d5" font-size="14">Contracts / owned data</text>

    <rect x="729" y="207" width="196" height="112" rx="12" fill="#2c2635" stroke="#c084fc" stroke-opacity="0.7"/>
    <text x="749" y="236" fill="#d8b4fe" font-size="12" font-weight="700" letter-spacing="1.2">DATA + EVENTS</text>
    <text x="749" y="266" fill="#f1f5f9" font-size="18" font-weight="600">Data + Messaging</text>
    <text x="749" y="293" fill="#b6c4d5" font-size="14">PostgreSQL / RabbitMQ</text>

    <rect x="956" y="207" width="196" height="112" rx="12" fill="#332b25" stroke="#fb923c" stroke-opacity="0.7"/>
    <text x="976" y="236" fill="#fdba74" font-size="12" font-weight="700" letter-spacing="1.2">INTEGRATIONS</text>
    <text x="976" y="266" fill="#f1f5f9" font-size="18" font-weight="600">Provider Adapters</text>
    <text x="976" y="293" fill="#b6c4d5" font-size="14">Identity / payments / mail</text>

    <text x="48" y="365" fill="#94a3b8" font-size="13">DDD + CLEAN ARCHITECTURE</text>
    <text x="600" y="365" fill="#94a3b8" font-size="13" text-anchor="middle">MODULE-OWNED PERSISTENCE</text>
    <text x="1152" y="365" fill="#94a3b8" font-size="13" text-anchor="end">AT-LEAST-ONCE MESSAGING</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M249 263 H266"/>
    <path d="M476 263 H493"/>
    <path d="M703 263 H720"/>
    <path d="M930 263 H947"/>
  </g>
</svg>
