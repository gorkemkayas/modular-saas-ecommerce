services:
  ecommerce-db:
    image: postgres:17-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  ecommerce-api:
    build:
      context: .
      dockerfile: src/Host/ECommerce.API/Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    depends_on:
      ecommerce-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL}
      DataProtection__ApplicationName: ECommerce.API
      DataProtection__KeysPath: ${DATA_PROTECTION_KEYS_PATH}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      ServiceTokens__ECommerce: ${ECOMMERCE_SERVICE_TOKEN}
      AuthService__BaseUrl: ${AUTH_SERVICE_BASE_URL}
      AuthService__RegisterPath: /api/v1/auth/register
      AuthService__LoginPath: /api/v1/auth/login
      AuthService__RefreshPath: /api/v1/auth/refresh
      AuthService__ApiKey: ${AUTH_SERVICE_API_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_BASE_URL}
      Modules__Store__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${STORE_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Catalog__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${CATALOG_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Customer__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${CUSTOMER_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Pricing__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${PRICING_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Inventory__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${INVENTORY_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Notification__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${NOTIFICATION_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Order__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${ORDER_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Payment__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${PAYMENT_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Shipment__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${SHIPMENT_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Subscription__Database__ConnectionString: Host=ecommerce-db;Port=5432;Database=${SUBSCRIPTION_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Modules__Notification__Email__Provider: Resend
      Modules__Notification__Email__ApiKey: ${RESEND_API_KEY}
      Modules__Notification__Email__BaseUrl: https://api.resend.com
      Modules__Notification__Email__WebhookSecret: ${RESEND_WEBHOOK_SECRET}
      Modules__Notification__Email__FromEmail: ${NOTIFICATION_FROM_EMAIL}
      Modules__Notification__Email__FromName: ${NOTIFICATION_FROM_NAME}
      Modules__Notification__Email__ReplyTo: ${NOTIFICATION_REPLY_TO}
      CloudinaryMediaStorage__ApiBaseUrl: https://api.cloudinary.com
      CloudinaryMediaStorage__CloudName: ${CLOUDINARY_CLOUD_NAME}
      CloudinaryMediaStorage__ApiKey: ${CLOUDINARY_API_KEY}
      CloudinaryMediaStorage__ApiSecret: ${CLOUDINARY_API_SECRET}
      CloudinaryMediaStorage__Folder: stores/product-media
      Modules__Payment__Gateway__Provider: ${PAYMENT_GATEWAY_PROVIDER}
      Modules__Payment__Iyzico__Environment: ${IYZICO_ENVIRONMENT}
      Modules__Payment__Iyzico__Locale: ${IYZICO_LOCALE}
      Modules__Payment__Iyzico__CallbackUrl: ${IYZICO_CALLBACK_URL}
      Modules__Payment__Iyzico__DefaultBuyerIdentityNumber: ${IYZICO_DEFAULT_BUYER_IDENTITY_NUMBER}
      Modules__Payment__Iyzico__InitializeCheckoutFormPath: /payment/iyzipos/checkoutform/initialize/auth/ecom
      Modules__Payment__Iyzico__RetrieveCheckoutFormPath: /payment/iyzipos/checkoutform/auth/ecom/detail
      Modules__Payment__Iyzico__CapturePath: /payment/capture
      Modules__Payment__Iyzico__CancelPath: /payment/cancel
      Modules__Payment__Iyzico__RefundPath: /payment/refund
    volumes:
      - ecommerce_dp_keys:${DATA_PROTECTION_KEYS_PATH}
      - ecommerce_api_logs:/app/Logs
    expose:
      - "8080"

  ecommerce-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      - ecommerce-api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_DEFAULT_STORE_SLUG: ${NEXT_PUBLIC_DEFAULT_STORE_SLUG}
      AUTH_SERVICE_BASE_URL: ${AUTH_SERVICE_BASE_URL}
      NEXT_PUBLIC_AUTH_SERVICE_BASE_URL: ${NEXT_PUBLIC_AUTH_SERVICE_BASE_URL}
      AUTH_SERVICE_TENANT_REGISTER_PATH: ${AUTH_SERVICE_TENANT_REGISTER_PATH}
      AUTH_SERVICE_STORE_OWNER_REGISTER_PATH: ${AUTH_SERVICE_STORE_OWNER_REGISTER_PATH}
      AUTH_SERVICE_API_KEY: ${AUTH_SERVICE_API_KEY}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    depends_on:
      - ecommerce-api
      - ecommerce-frontend
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ecommerce_postgres_data:
  ecommerce_dp_keys:
  ecommerce_api_logs:
