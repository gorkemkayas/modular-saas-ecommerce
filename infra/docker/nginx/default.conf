upstream ecommerce_frontend_upstream {
    server ecommerce-frontend:3000;
}

upstream ecommerce_api_upstream {
    server ecommerce-api:8080;
}

server {
    listen 80;
    server_name shop.kayas.dev;

    location / {
        proxy_pass http://ecommerce_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name api.kayas.dev;

    location / {
        proxy_pass http://ecommerce_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
